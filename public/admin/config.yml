
# Sveltia CMS configuration

backend:
  name: github
  repo: KartikeySriv/obsidian-finance-dashboard
  branch: main
  auth_methods:
    - token
  skip_ci: true

# Media storage inside the GitHub repository
media_folder: public/uploads
public_folder: /uploads

# CMS collections
collections:
  - name: insights
    label: Finance Insights
    label_singular: Finance Insight
    folder: content/insights
    create: true

    fields:
      - name: title
        label: Title
        widget: string

      - name: date
        label: Published Date
        widget: datetime
        type: date

      - name: category
        label: Category
        widget: select
        options:
          - Markets
          - Personal Finance
          - Technology

      - name: summary
        label: Summary
        widget: text

      - name: body
        label: Content
        widget: markdown

  - name: market_data
    label: Market Data
    files:
      - name: market_data
        label: Market Data
        file: public/data/market-data.json
        format: json
        fields:
          - name: stocks
            label: Top Equities
            label_singular: Equity
            widget: list
            summary: '{{symbol}} — {{name}}'
            fields:
              - name: name
                label: Name
                widget: string

              - name: symbol
                label: Symbol
                widget: string

              - name: price
                label: Price
                widget: number
                value_type: float

              - name: change
                label: Change (%)
                widget: number
                value_type: float

              - name: trend
                label: Trend
                widget: list
                field:
                  name: value
                  label: Value
                  widget: number
                  value_type: float

          - name: crypto
            label: Digital Assets
            label_singular: Digital Asset
            widget: list
            summary: '{{symbol}} — {{name}}'
            fields:
              - name: name
                label: Name
                widget: string

              - name: symbol
                label: Symbol
                widget: string

              - name: price
                label: Price
                widget: number
                value_type: float

              - name: change
                label: Change (%)
                widget: number
                value_type: float

              - name: trend
                label: Trend
                widget: list
                field:
                  name: value
                  label: Value
                  widget: number
                  value_type: float
